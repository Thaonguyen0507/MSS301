spring.application.name=api-gateway
server.port=9000

services.product.url=http://localhost:8080
services.order.url=http://localhost:8081
services.inventory.url=http://localhost:8082

# ==========================================================
# TODO GW-3 – Cấu hình Keycloak Issuer URI
# ----------------------------------------------------------
# YÊU CẦU:
#   Thêm property sau để Spring Security biết địa chỉ Keycloak
#   và tự động tải Public Key (JWKS) để xác minh chữ ký JWT.
#
#   spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-realm
#
# LƯU Ý:
#   Keycloak phải đang chạy (docker compose up -d) trước khi
#   khởi động API Gateway.
# ==========================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-realm

management.endpoints.web.exposure.include=health

# Part 5: Swagger UI aggregates the three microservices
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs
