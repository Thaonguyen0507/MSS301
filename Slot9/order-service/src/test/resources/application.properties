# WireMock tự set property này với port ngẫu nhiên khi @AutoConfigureWireMock(port=0)
# Order Service sẽ gọi WireMock thay vì Inventory Service thật
inventory.url=http://localhost:${wiremock.server.port}

# Keep Swagger paths consistent with the runtime configuration.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
